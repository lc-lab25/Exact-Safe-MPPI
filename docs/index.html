<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exact-Safe MPPI</title>
<style>
  :root { --fg:#1b1b1b; --mut:#5a5a5a; --line:#e2e2e2; --bg:#fff; --card:#fafafa; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e9e9e9; --mut:#a8a8a8; --line:#333; --bg:#151515; --card:#1e1e1e; }
  }
  html { color-scheme: light dark; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; padding:48px 20px 72px; }
  h1 { font-size:1.9rem; line-height:1.25; margin:0 0 .35em; }
  .authors { font-size:1.05rem; margin:0 0 .15em; }
  .affil { color:var(--mut); margin:0; }
  .links { margin:1.5em 0 2.2em; }
  .links a { display:inline-block; padding:8px 16px; border:1px solid var(--line);
              border-radius:7px; text-decoration:none; color:var(--fg); background:var(--card); }
  .links a:hover { border-color:var(--mut); }
  .grid { display:grid; gap:26px; grid-template-columns:repeat(auto-fit,minmax(380px,1fr)); }
  figure { margin:0; }
  video, .fallback { width:100%; aspect-ratio:16/9; background:#000; border-radius:8px;
                      display:block; }
  .fallback { background:none; }
  figcaption { color:var(--mut); font-size:.9rem; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">

  <h1>Composing Exact Barriers Inside an MPPI Planner</h1>
  <p class="authors">Alex Coker and Leilei Cui</p>
  <p class="affil">Department of Mechanical Engineering, University of New Mexico</p>

  <p class="links"><a href="https://github.com/alexkcoker/exact-safe-mppi">Code on GitHub</a></p>

  <div class="grid">
    <figure>
      <video controls preload="metadata" data-name="teaser" poster="assets/media/placeholders/teaser.svg">
        <source src="assets/media/videos/teaser.mp4" type="video/mp4">
      </video>
      <img class="fallback" data-for="teaser" src="assets/media/placeholders/teaser.svg" alt="Soft-min vs exact, disk gap" hidden>
      <figcaption>Soft-min vs exact, disk gap</figcaption>
    </figure>
    <figure>
      <video controls preload="metadata" data-name="disk_gap_softmin_rho1_deadlock" poster="assets/media/placeholders/disk_gap_softmin_rho1_deadlock.svg">
        <source src="assets/media/videos/disk_gap_softmin_rho1_deadlock.mp4" type="video/mp4">
      </video>
      <img class="fallback" data-for="disk_gap_softmin_rho1_deadlock" src="assets/media/placeholders/disk_gap_softmin_rho1_deadlock.svg" alt="Disk gap w=0.12, &rho;=1 (&kappa;=0.606 &lt; ln 2): soft min halts" hidden>
      <figcaption>Disk gap w=0.12, &rho;=1 (&kappa;=0.606 &lt; ln 2): soft min halts</figcaption>
    </figure>
    <figure>
      <video controls preload="metadata" data-name="disk_gap_exact_threads" poster="assets/media/placeholders/disk_gap_exact_threads.svg">
        <source src="assets/media/videos/disk_gap_exact_threads.mp4" type="video/mp4">
      </video>
      <img class="fallback" data-for="disk_gap_exact_threads" src="assets/media/placeholders/disk_gap_exact_threads.svg" alt="Disk gap w=0.12: exact composition threads the gap" hidden>
      <figcaption>Disk gap w=0.12: exact composition threads the gap</figcaption>
    </figure>
    <figure>
      <video controls preload="metadata" data-name="box_gap_softmin_vs_exact" poster="assets/media/placeholders/box_gap_softmin_vs_exact.svg">
        <source src="assets/media/videos/box_gap_softmin_vs_exact.mp4" type="video/mp4">
      </video>
      <img class="fallback" data-for="box_gap_softmin_vs_exact" src="assets/media/placeholders/box_gap_softmin_vs_exact.svg" alt="Rounded-square gap (p=8): soft min vs exact" hidden>
      <figcaption>Rounded-square gap (p=8): soft min vs exact</figcaption>
    </figure>
    <figure>
      <video controls preload="metadata" data-name="nine_constraint_exact_safe" poster="assets/media/placeholders/nine_constraint_exact_safe.svg">
        <source src="assets/media/videos/nine_constraint_exact_safe.mp4" type="video/mp4">
      </video>
      <img class="fallback" data-for="nine_constraint_exact_safe" src="assets/media/placeholders/nine_constraint_exact_safe.svg" alt="Nine-constraint map: Exact-Safe MPPI" hidden>
      <figcaption>Nine-constraint map: Exact-Safe MPPI</figcaption>
    </figure>
    <figure>
      <video controls preload="metadata" data-name="nine_constraint_softmin_rho200" poster="assets/media/placeholders/nine_constraint_softmin_rho200.svg">
        <source src="assets/media/videos/nine_constraint_softmin_rho200.mp4" type="video/mp4">
      </video>
      <img class="fallback" data-for="nine_constraint_softmin_rho200" src="assets/media/placeholders/nine_constraint_softmin_rho200.svg" alt="Nine-constraint map: soft min, &rho;=200" hidden>
      <figcaption>Nine-constraint map: soft min, &rho;=200</figcaption>
    </figure>
    <figure>
      <video controls preload="metadata" data-name="nine_constraint_shield" poster="assets/media/placeholders/nine_constraint_shield.svg">
        <source src="assets/media/videos/nine_constraint_shield.mp4" type="video/mp4">
      </video>
      <img class="fallback" data-for="nine_constraint_shield" src="assets/media/placeholders/nine_constraint_shield.svg" alt="Nine-constraint map: discrete-time repair baseline" hidden>
      <figcaption>Nine-constraint map: discrete-time repair baseline</figcaption>
    </figure>
    <figure>
      <video controls preload="metadata" data-name="kmax1_ablation_chattering" poster="assets/media/placeholders/kmax1_ablation_chattering.svg">
        <source src="assets/media/videos/kmax1_ablation_chattering.mp4" type="video/mp4">
      </video>
      <img class="fallback" data-for="kmax1_ablation_chattering" src="assets/media/placeholders/kmax1_ablation_chattering.svg" alt="Single most-active constraint (k_max=1): chattering" hidden>
      <figcaption>Single most-active constraint (k_max=1): chattering</figcaption>
    </figure>
  </div>

</div>

<script>
// If a video file is absent or undecodable, swap in its placeholder card.
document.querySelectorAll('video[data-name]').forEach(function (v) {
  function fallback() {
    var img = document.querySelector('img.fallback[data-for="' + v.dataset.name + '"]');
    if (img) { img.hidden = false; v.hidden = true; }
  }
  v.addEventListener('error', fallback, true);
  var s = v.querySelector('source');
  if (s) { s.addEventListener('error', fallback); }
  setTimeout(function () { if (!v.videoWidth) { fallback(); } }, 2500);
});
</script>
</body>
</html>
